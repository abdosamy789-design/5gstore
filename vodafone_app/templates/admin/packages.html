{% extends "admin/base_admin.html" %}
{% block title %}إدارة الباقات{% endblock %}
{% block content %}
<section class="admin-page">
  <h1>باقات فودافون ريد</h1>
  <p class="section-lead">أضف باقات جديدة أو عدّل الأسعار والمواصفات.</p>

  <form method="post" class="order-form compact-form">
    <input type="hidden" name="action" value="create" />
    <h2>إضافة باقة</h2>
    <div class="form-grid">
      <label>الاسم<input name="name" required placeholder="فودافون ريد 100" /></label>
      <label>السعر (ج.م)<input name="price" type="number" step="0.01" required /></label>
      <label>سعر الجملة<input name="wholesale_price" type="number" step="0.01" placeholder="للموزعين" /></label>
      <label>الإنترنت (جيجا)<input name="data_gb" type="number" step="0.1" value="0" /></label>
      <label>الدقايق<input name="minutes" type="number" value="0" /></label>
      <label>الصلاحية (يوم)<input name="validity_days" type="number" value="30" /></label>
      <label>الوصف<input name="description" placeholder="وصف مختصر" /></label>
    </div>
    <button type="submit" class="btn btn-primary">إضافة</button>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>تعديل السعر</th>
          <th>نشطة؟</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for p in packages %}
        <tr>
          <td>
            <form method="post" class="inline-edit-form">
              <input type="hidden" name="action" value="update" />
              <input type="hidden" name="package_id" value="{{ p.id }}" />
              <div class="form-grid">
                <label>الاسم<input name="name" value="{{ p.name }}" required /></label>
                <label>السعر<input name="price" type="number" step="0.01" value="{{ p.price }}" required /></label>
                <label>جملة<input name="wholesale_price" type="number" step="0.01" value="{{ p.wholesale_price if p.wholesale_price is not none else '' }}" /></label>
                <label>جيجا<input name="data_gb" type="number" step="0.1" value="{{ p.data_gb }}" /></label>
                <label>دقايق<input name="minutes" type="number" value="{{ p.minutes }}" /></label>
                <label>أيام<input name="validity_days" type="number" value="{{ p.validity_days }}" /></label>
                <label>وصف<input name="description" value="{{ p.description or '' }}" /></label>
              </div>
              <button class="btn btn-primary btn-sm" type="submit">حفظ التعديل</button>
            </form>
          </td>
          <td>{{ 'نعم' if p.is_active else 'لا' }}</td>
          <td>
            <form method="post" action="{{ url_for('admin_toggle_package', package_id=p.id) }}">
              <button class="btn btn-secondary btn-sm">{{ 'إيقاف' if p.is_active else 'تفعيل' }}</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
